name: Release

# Builds the Caixa-Preta installer for a version tag (v1.0.0) and attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build the installer
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/PcMonitor.Dashboard.Web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: src/PcMonitor.Dashboard.Web/pnpm-lock.yaml

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build the installer
        shell: powershell
        run: ./scripts/Build-Release.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v')) -PnpmCommand pnpm

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/release/CaixaPreta-Setup-*.exe artifacts/release/CaixaPreta-Setup-*.exe.sha256 --title "Caixa-Preta $($env:GITHUB_REF_NAME)" --generate-notes
